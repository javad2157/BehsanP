  - name: PORT
    key: PORT
  - name: ADMIN_NID
    key: ADMIN_NID
  - name: ADMIN_BIRTHDATE
    key: ADMIN_BIRTHDATE
  - name: ADMIN_MOBILE
    key: ADMIN_MOBILE
  - name: ADMIN_PASS
    key: ADMIN_PASS
  - name: BASE_URL
    key: BASE_URL
  - name: AUTH_URL
    key: AUTH_URL
  - name: BHUB_URL
    key: BHUB_URL
  - name: DB_HOST_REDIS
    key: DB_HOST_REDIS
  - name: HUB_URL
    key: HUB_URL
  - name: HUB_APP_NAME
    key: HUB_APP_NAME
  - name: HUB_USER_NAME
    key: HUB_USER_NAME
  - name: HUB_PASSWORD
    key: HUB_PASSWORD
  - name: MICRO_URL
    key: MICRO_URL
  - name: MICRO_APP_NAME
    key: MICRO_APP_NAME
  - name: MICRO_REFRESH_TOKEN
    key: MICRO_REFRESH_TOKEN
  - name: HUB_REFRESH_TOKEN
    key: HUB_REFRESH_TOKEN
  - name: RBMQ_QUEUE
    key: RBMQ_QUEUE
