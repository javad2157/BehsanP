# Default values for hub-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: "192.168.236.156:8083/exchange-frontend"
  # Overrides the image tag whose default is the chart appVersion.
  tag: "production-7717af24"

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true

  annotations: { }

  name: ""

podAnnotations: { }

podSecurityContext: { }
securityContext: { }

service:
  name: exchange-front
  type: ClusterIP
  port: 80
  targetPort: 3001


ingress:
  enabled: true
  hostname: axoex.ir
  className: traefik
  annotations: {}
  paths:
    - path: /
      pathType: Prefix
      service:
        port: 80


resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

secretName: saraf-frontend-secrets
environmentVariables:
  - name: NEXT_PUBLIC_APP_BACKEND_URL
    key: NEXT_PUBLIC_APP_BACKEND_URL
